<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LitchiMC Admin Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .sidebar { background: #0a0a0a; border-right: 1px solid #330000; }
        .card-glass { background: rgba(20, 0, 0, 0.6); backdrop-filter: blur(10px); border: 1px solid #450a0a; }
        .active { display: block !important; }
    </style>
</head>
<body class="bg-[#030005] text-white flex h-screen">

    <div id="auth-section" class="flex-1 flex items-center justify-center">
        <button id="login-btn" class="bg-red-600 hover:bg-red-700 px-8 py-3 rounded-xl font-bold">Secure Access: Sign In</button>
    </div>

    <div id="admin-panel" class="hidden flex w-full">
        <aside class="sidebar w-64 p-6 flex flex-col gap-6">
            <h2 class="text-xl font-bold text-red-500">LITCHI DASHBOARD</h2>
            <button onclick="showTab('ranks')" class="text-left hover:text-red-400">Manage Ranks</button>
            <button onclick="showTab('crates')" class="text-left hover:text-red-400">Manage Crates</button>
            <button onclick="showTab('orders')" class="text-left hover:text-red-400">Live Orders</button>
        </aside>

        <main class="flex-1 p-8 overflow-y-auto">
            <div id="ranks" class="tab-content hidden card-glass p-6 rounded-2xl">
                <h2 class="text-2xl mb-6">Manage Ranks</h2>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="r-name" placeholder="Rank Name" class="bg-black p-3 border border-red-900 rounded">
                    <input type="number" id="r-price" placeholder="Price" class="bg-black p-3 border border-red-900 rounded">
                    <select id="r-currency" class="bg-black p-3 border border-red-900 rounded col-span-2">
                        <option value="USD">USD ($)</option><option value="PKR">PKR (₨)</option>
                    </select>
                </div>
                <button onclick="addRank()" class="mt-4 bg-red-600 w-full py-3 rounded-lg font-bold">Deploy Rank</button>
            </div>

            <div id="orders" class="tab-content hidden">
                <h2 class="text-2xl mb-6">Incoming Orders</h2>
                <div id="order-list" class="space-y-3">
                    </div>
            </div>
        </main>
    </div>

    <script type="module" src="js/admin.js"></script>
    <script>
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
