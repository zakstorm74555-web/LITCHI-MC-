<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LitchiMC | Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-card { background: rgba(15, 0, 0, 0.7); backdrop-filter: blur(12px); border: 1px solid #450a0a; }
        .tab-content { display: none; }
        .active { display: block; }
    </style>
</head>
<body class="bg-[#030005] text-gray-200 min-h-screen p-6">

    <div id="auth-section" class="flex h-screen items-center justify-center">
        <button id="login-btn" class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-full font-bold transition">Sign In with Google</button>
    </div>

    <div id="admin-panel" class="hidden max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-red-500">Master Admin</h1>
            <nav class="flex gap-4">
                <button onclick="showTab('ranks')" class="bg-red-900/30 px-4 py-2 rounded">Ranks</button>
                <button onclick="showTab('crates')" class="bg-red-900/30 px-4 py-2 rounded">Crates</button>
            </nav>
        </header>

        <div id="ranks" class="tab-content active glass-card p-6 rounded-xl">
            <h2 class="text-xl font-bold mb-4">Add Rank</h2>
            <input type="text" id="r-name" placeholder="Rank Name" class="w-full bg-black border border-red-800 p-3 rounded mb-3">
            
            <div class="flex gap-4">
                <input type="number" id="r-price" placeholder="Price" class="w-full bg-black border border-red-800 p-3 rounded mb-3">
                <select id="r-currency" class="bg-black border border-red-800 p-3 rounded mb-3">
                    </select>
            </div>
            <button onclick="addRank()" class="w-full bg-red-600 py-3 rounded font-bold">Deploy Rank</button>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
    <script>
        // Currency List
        const currencies = ["USD", "PKR", "EUR", "GBP", "INR", "AED", "SAR", "CAD", "AUD"];
        const select = document.getElementById('r-currency');
        currencies.forEach(c => select.innerHTML += `<option value="${c}">${c}</option>`);
        
        function showTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }
    </script>
</body>
</html>
